name: Build OverlayNote

on:
  push:
    branches: ["**"]
    paths:
      - "overlaynote/**"
      - ".github/workflows/overlaynote.yml"
  pull_request:
    paths:
      - "overlaynote/**"

concurrency:
  group: overlaynote-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: overlaynote

jobs:
  # ── macOS (Apple Silicon) ──────────────────────────────────────────────────
  build-macos:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: overlaynote/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: overlaynote/src-tauri -> overlaynote/src-tauri/target

      - name: Build (release)
        run: npx tauri build --bundles dmg
        env:
          # macOSPrivateApi requires this to be set
          APPLE_SIGNING_IDENTITY: "-"

      - uses: actions/upload-artifact@v4
        with:
          name: overlaynote-macos-arm64
          path: overlaynote/src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 14

  # ── Windows (x64) ─────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: overlaynote/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: overlaynote/src-tauri -> overlaynote/src-tauri/target

      - name: Build (release)
        run: npx tauri build --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: overlaynote-windows-x64
          path: overlaynote/src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 14
